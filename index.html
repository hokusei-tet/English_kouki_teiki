<!DOCTYPE html>
<html lang="ja">
<head>

  <title>英語 後期定期範囲 まとめ</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>

<body>
  <h1>英語 後期定期範囲 まとめ</h1>

  <div id="lesson-list" class="section visible">
    <button class="full-width-button" onclick="openLesson('lesson8')">LESSON 8</button>
    <button class="full-width-button" onclick="openLesson('lesson9')">LESSON 9</button>
  </div>

  <div id="lesson8-part-list" class="section">
    <div class="part-row"><span class="part-label">Part 1</span><div class="btn-group-sm"><button class="sm-button btn-word" onclick="showContent('l8p1', 'word')">単語</button><button class="sm-button btn-main" onclick="showContent('l8p1', 'main')">本文</button></div></div>
    <div class="part-row"><span class="part-label">Part 2</span><div class="btn-group-sm"><button class="sm-button btn-word" onclick="showContent('l8p2', 'word')">単語</button><button class="sm-button btn-main" onclick="showContent('l8p2', 'main')">本文</button></div></div>
    <div class="part-row"><span class="part-label">Part 3</span><div class="btn-group-sm"><button class="sm-button btn-word" onclick="showContent('l8p3', 'word')">単語</button><button class="sm-button btn-main" onclick="showContent('l8p3', 'main')">本文</button></div></div>
    <div class="part-row"><span class="part-label">Part 4</span><div class="btn-group-sm"><button class="sm-button btn-word" onclick="showContent('l8p4', 'word')">単語</button><button class="sm-button btn-main" onclick="showContent('l8p4', 'main')">本文</button></div></div>
    <button class="full-width-button" style="background-color: #6c757d;" onclick="goBackToLessons()">← 戻る</button>
  </div>

	<div id="lesson9-part-list" class="section">
    <div class="part-row"><span class="part-label">Part 1</span><div class="btn-group-sm"><button class="sm-button btn-word" onclick="showContent('l9p1', 'word')">単語</button><button class="sm-button btn-main" onclick="showContent('l9p1', 'main')">本文</button></div></div>
    <div class="part-row"><span class="part-label">Part 2</span><div class="btn-group-sm"><button class="sm-button btn-word" onclick="showContent('l9p2', 'word')">単語</button><button class="sm-button btn-main" onclick="showContent('l9p2', 'main')">本文</button></div></div>
    <div class="part-row"><span class="part-label">Part 3</span><div class="btn-group-sm"><button class="sm-button btn-word" onclick="showContent('l9p3', 'word')">単語</button><button class="sm-button btn-main" onclick="showContent('l9p3', 'main')">本文</button></div></div>
    <div class="part-row"><span class="part-label">Part 4</span><div class="btn-group-sm"><button class="sm-button btn-word" onclick="showContent('l9p4', 'word')">単語</button><button class="sm-button btn-main" onclick="showContent('l9p4', 'main')">本文</button></div></div>
    <button class="full-width-button" style="background-color: #6c757d;" onclick="goBackToLessons()">← 戻る</button>
  </div>

  <div id="toggle-buttons" class="button-group">
    <button id="toggleEnglish">英文</button>
    <button id="toggleJapanese">日本語訳</button>
    <button onclick="goBackToParts()" style="background-color: #6c757d; color: white; border: none; border-radius: 5px; padding: 10px;">← 戻る</button>
  </div>
</body>
</html>
